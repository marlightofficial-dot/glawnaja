<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Smarloww | Анкета</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        body { background: #313338; color: #dbdee1; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #2b2d31; padding: 30px; border-radius: 10px; width: 350px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); border: 1px solid #404249; text-align: center; }
        input, textarea, select { width: 100%; padding: 10px; margin: 10px 0; background: #1e1f22; border: 1px solid #1e1f22; color: white; border-radius: 4px; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; background: #5865F2; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        h2 { color: white; }
    </style>
</head>
<body>

<div class="card" id="main-card">
    <h2>Анкета в команду</h2>
    <form id="anketa">
        <input type="text" id="name" placeholder="Ник Discord" required>
        <input type="email" id="email" placeholder="Email" required>
        <input type="number" id="age" placeholder="Возраст" required>
        <select id="role">
            <option value="Хелпер">Хелпер</option>
            <option value="Модератор">Модератор</option>
            <option value="Админ">Админ</option>
        </select>
        <textarea id="about" rows="3" placeholder="О себе"></textarea>
        <button type="submit" class="btn" id="send-btn">ОТПРАВИТЬ</button>
    </form>
</div>

<script>
    // Твой Public Key
    emailjs.init("01DGSF2cD56lx_iXW");

    const SERVICE_ID = "service_54p6rgt"; 
    const TEMPLATE_ID = "template_ycejc4h"; 
    const WEBHOOK = "https://discord.com/api/webhooks/1475580603184320614/JWKjiXXf0dpGqxXzkSlTbkasrZLhThNASqjfTiguLD7ZILWXHM8CfTTwdyJ48L7tWp6P";

    const params = new URLSearchParams(window.location.search);

    // ЛОГИКА ОТВЕТА (ПРИНЯТЬ/ОТКЛОНИТЬ)
    if (params.has('action')) {
        document.getElementById('main-card').innerHTML = "<h2>Отправка письма...</h2><p>Подождите секунду.</p>";
        
        const action = params.get('action');
        const statusText = action === 'accept' ? "ПРИНЯТА" : "ОТКЛОНЕНА";
        
        emailjs.send(SERVICE_ID, TEMPLATE_ID, {
            to_name: params.get('name'),
            to_email: params.get('email'),
            status: "Ваша заявка " + statusText
        }).then(() => {
            alert("Успешно! Письмо отправлено: " + statusText);
            window.close();
        }).catch((err) => {
            alert("ОШИБКА EmailJS: " + JSON.stringify(err));
        });
    }

    // ЛОГИКА ОТПРАВКИ В DISCORD
    document.getElementById('anketa').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('send-btn');
        btn.disabled = true;
        btn.innerText = "ОТПРАВЛЯЮ...";

        const n = document.getElementById('name').value;
        const em = document.getElementById('email').value;
        const currentUrl = window.location.href.split('?')[0];
        
        const aLink = `${currentUrl}?action=accept&email=${em}&name=${encodeURIComponent(n)}`;
        const dLink = `${currentUrl}?action=decline&email=${em}&name=${encodeURIComponent(n)}`;

        try {
            await fetch(WEBHOOK, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    username: "Smarloww Bot",
                    embeds: [{
                        title: "📩 Новая заявка!",
                        color: 5814783,
                        fields: [
                            { name: "👤 Ник", value: n, inline: true },
                            { name: "📧 Почта", value: em, inline: true },
                            { name: "🛠 Роль", value: document.getElementById('role').value },
                            { name: "⚡ Решение", value: `[✅ ПРИНЯТЬ](${aLink}) | [❌ ОТКЛОНИТЬ](${dLink})` }
                        ]
                    }]
                })
            });
            alert("Заявка улетела в Discord!");
            btn.innerText = "ГОТОВО";
        } catch (error) {
            alert("Ошибка Discord: " + error);
            btn.disabled = false;
        }
    };
</script>
</body>
</html>
