<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Smarloww Security | Заявка</title>
    <style>
        :root {
            --primary: #5865F2;
            --bg: #1e1f22;
            --card-bg: #2b2d31;
            --input-bg: #1e1f22;
            --text: #ffffff;
            --text-muted: #b5bac1;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 700px;
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        .header { padding: 20px 30px; background: rgba(0,0,0,0.2); font-weight: bold; font-size: 18px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .form-content { padding: 30px; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .field { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 10px; text-transform: uppercase; color: var(--text-muted); font-weight: bold; }
        
        input, select, textarea {
            background: var(--input-bg);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 12px;
            border-radius: 6px;
            color: white;
            outline: none;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .submit-btn:hover { background: #4752c4; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">🛡️ SMARLOWW RECRUITMENT</div>
    <div class="form-content">
        <form id="anketa">
            <div class="grid">
                <div class="field"><label>Ник</label><input type="text" id="name" required></div>
                <div class="field"><label>Email</label><input type="email" id="email" required></div>
                <div class="field"><label>Возраст</label><input type="number" id="age" required></div>
                <div class="field">
                    <label>Роль</label>
                    <select id="role">
                        <option>Хелпер</option><option>Модератор</option><option>Админ</option>
                        <option>Менеджер</option><option>Куратор</option><option>Co-Owner</option>
                    </select>
                </div>
            </div>
            <div class="field"><label>О себе</label><textarea id="about" rows="3"></textarea></div>
            <button type="submit" class="submit-btn" id="s-btn">ОТПРАВИТЬ ЗАЯВКУ</button>
        </form>
    </div>
</div>

<script>
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1475580603184320614/JWKjiXXf0dpGqxXzkSlTbkasrZLhThNASqjfTiguLD7ZILWXHM8CfTTwdyJ48L7tWp6P";

    document.getElementById('anketa').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('s-btn');
        btn.disabled = true;

        const data = {
            n: document.getElementById('name').value,
            em: document.getElementById('email').value,
            ag: document.getElementById('age').value,
            rl: document.getElementById('role').value,
            ab: document.getElementById('about').value || "Нет данных"
        };

        // Максимально короткие ссылки для Gmail, чтобы Discord их не ломал
        const linkAcc = `https://mail.google.com/mail/?view=cm&fs=1&to=${data.em}&su=Принят&body=Вы+приняты!`;
        const linkDec = `https://mail.google.com/mail/?view=cm&fs=1&to=${data.em}&su=Отказ&body=К+сожалению,+отказ.`;

        const payload = {
            embeds: [{
                title: "🛡️ НОВАЯ ЗАЯВКА",
                color: 5814783,
                fields: [
                    { name: "👤 Ник", value: data.n, inline: true },
                    { name: "🎂 Возраст", value: data.ag, inline: true },
                    { name: "🛠 Роль", value: data.rl, inline: true },
                    { name: "📧 Почта", value: data.em },
                    { name: "📝 Досье", value: data.ab },
                    { name: "⚡ ВЕРДИКТ", value: `✅ [ОДОБРИТЬ](${linkAcc})\n\n❌ [ОТКЛОНИТЬ](${linkDec})` }
                ],
                footer: { text: "marlight.official@gmail.com" }
            }]
        };

        try {
            await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            alert("✅ Успешно!");
            window.location.href = "index.html";
        } catch (err) {
            alert("Ошибка!");
            btn.disabled = false;
        }
    };
</script>
</body>
</html>
