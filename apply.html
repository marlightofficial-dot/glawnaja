<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Smarloww | Анкета</title>
    <style>
        body { background: #0f0f0f; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #212121; padding: 30px; border-radius: 12px; width: 350px; border: 1px solid #333; }
        input, textarea, select { width: 100%; padding: 12px; margin: 10px 0; background: #0f0f0f; border: 1px solid #333; color: white; border-radius: 4px; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; background: #3ea6ff; color: #000; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h2 style="text-align:center">Анкета</h2>
    <form id="anketa">
        <input type="text" id="name" placeholder="Ник Discord" required>
        <input type="email" id="email" placeholder="Твой Email" required>
        <input type="number" id="age" placeholder="Возраст" required>
        <select id="role">
            <option value="Хелпер">Хелпер</option>
            <option value="Модератор">Модератор</option>
            <option value="Админ">Админ</option>
        </select>
        <textarea id="about" rows="3" placeholder="О себе"></textarea>
        <button type="submit" class="btn">ОТПРАВИТЬ</button>
    </form>
</div>

<script>
    const WEBHOOK = "https://discord.com/api/webhooks/1475580603184320614/JWKjiXXf0dpGqxXzkSlTbkasrZLhThNASqjfTiguLD7ZILWXHM8CfTTwdyJ48L7tWp6P";

    document.getElementById('anketa').onsubmit = async (e) => {
        e.preventDefault();
        
        const n = document.getElementById('name').value;
        const em = document.getElementById('email').value;
        const ag = document.getElementById('age').value; // Возраст теперь берется правильно
        const rl = document.getElementById('role').value;
        
        // Ссылки mailto: для ручного ответа
        const mailAccept = `mailto:${em}?subject=Принят&body=Привет, ты принят на роль ${rl}!`;
        const mailDecline = `mailto:${em}?subject=Отказ&body=Привет, твоя анкета отклонена.`;

        await fetch(WEBHOOK, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                username: "Smarloww Bot",
                embeds: [{
                    title: "📩 Новая заявка!",
                    color: 5814783,
                    fields: [
                        { name: "👤 Ник", value: n, inline: true },
                        { name: "📧 Почта", value: em, inline: true },
                        { name: "🎂 Возраст", value: ag, inline: true },
                        { name: "🛠 Роль", value: rl, inline: true },
                        { name: "⚡ Решение (вручную)", value: `[✅ ПРИНЯТЬ](${mailAccept}) | [❌ ОТКЛОНИТЬ](${mailDecline})` }
                    ]
                }]
            })
        });

        alert("Заявка улетела! Возвращаем тебя к видео...");
        window.location.href = "index.html"; // Кидает обратно на ютуб-страницу
    };
</script>
</body>
</html>
