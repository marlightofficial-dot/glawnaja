<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Smarloww | Заявка</title>
    <style>
        body { background: #1e1f22; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #2b2d31; padding: 30px; border-radius: 15px; width: 100%; max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        input, select, textarea { width: 100%; padding: 12px; margin: 10px 0; background: #1e1f22; border: 1px solid #3f3f46; color: white; border-radius: 8px; box-sizing: border-box; }
        .btn { width: 100%; padding: 15px; background: #5865F2; border: none; color: white; font-weight: bold; border-radius: 8px; cursor: pointer; }
        .btn:hover { background: #4752c4; }
    </style>
</head>
<body>

<div class="card">
    <h2 style="text-align:center; margin-top:0;">🛡️ АНКЕТА В ШТАБ</h2>
    <form id="anketa">
        <input type="text" id="name" placeholder="Твой Ник" required>
        <input type="email" id="email" placeholder="Твой Email" required>
        <input type="number" id="age" placeholder="Возраст" required>
        <select id="role">
            <option>Хелпер</option>
            <option>Модератор</option>
            <option>Админ</option>
            <option>Менеджер</option>
            <option>Куратор</option>
            <option>Co-Owner</option>
        </select>
        <textarea id="about" rows="3" placeholder="Расскажи о себе"></textarea>
        <button type="submit" class="btn" id="s-btn">ОТПРАВИТЬ</button>
    </form>
</div>

<script>
    // ТВОЙ ВЕБХУК ИЗ СКРИНШОТОВ
    const URL = "https://discord.com/api/webhooks/1475580603184320614/JWKjiXXf0dpGqxXzkSlTbkasrZLhThNASqjfTiguLD7ZILWXHM8CfTTwdyJ48L7tWp6P";

    document.getElementById('anketa').onsubmit = function(e) {
        e.preventDefault();
        const btn = document.getElementById('s-btn');
        btn.disabled = true;
        btn.innerText = "ОТПРАВКА...";

        const data = {
            n: document.getElementById('name').value,
            em: document.getElementById('email').value,
            ag: document.getElementById('age').value,
            rl: document.getElementById('role').value,
            ab: document.getElementById('about').value || "Пусто"
        };

        // Короткие ссылки для Gmail
        const lAcc = `https://mail.google.com/mail/?view=cm&fs=1&to=${data.em}&su=Принят&body=Вы+приняты!`;
        const lDec = `https://mail.google.com/mail/?view=cm&fs=1&to=${data.em}&su=Отказ&body=Отказ.`;

        const payload = {
            embeds: [{
                title: "🛡️ НОВАЯ ЗАЯВКА",
                color: 5814783,
                fields: [
                    { name: "👤 Ник", value: data.n, inline: true },
                    { name: "🎂 Возраст", value: data.ag, inline: true },
                    { name: "🛠 Роль", value: data.rl, inline: true },
                    { name: "📧 Почта", value: data.em },
                    { name: "📝 Досье", value: data.ab },
                    { name: "⚡ РЕШЕНИЕ", value: `[✅ ПРИНЯТЬ](${lAcc}) | [❌ ОТКЛОНИТЬ](${lDec})` }
                ],
                footer: { text: "Почта штаба: marlight.official@gmail.com" }
            }]
        };

        // Используем более надежный метод отправки
        fetch(URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(() => {
            alert("✅ Заявка ушла!");
            window.location.href = "index.html";
        })
        .catch(err => {
            alert("❌ Ошибка! Проверь интернет.");
            btn.disabled = false;
            btn.innerText = "ОТПРАВИТЬ";
        });
    };
</script>
</body>
</html>
