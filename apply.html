<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Smarloww | Анкета</title>
    <style>
        body { background: #313338; color: #dbdee1; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #2b2d31; padding: 30px; border-radius: 10px; width: 350px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); border: 1px solid #1e1f22; }
        h2 { text-align: center; color: white; margin-bottom: 20px; }
        label { display: block; font-size: 12px; margin-bottom: 5px; color: #b5bac1; text-transform: uppercase; font-weight: bold; }
        input, textarea, select { width: 100%; padding: 10px; margin-bottom: 15px; background: #1e1f22; border: 1px solid #1e1f22; color: white; border-radius: 4px; box-sizing: border-box; outline: none; }
        .btn { width: 100%; padding: 12px; background: #5865F2; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 16px; }
        .btn:disabled { background: #404249; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="card">
    <h2>Анкета в команду</h2>
    <form id="anketa">
        <label>Ник в Discord</label>
        <input type="text" id="name" placeholder="Swight#0001" required>
        
        <label>Ваш Email</label>
        <input type="email" id="email" placeholder="example@mail.com" required>
        
        <label>Возраст</label>
        <input type="number" id="age" placeholder="18" required>
        
        <label>Должность</label>
        <select id="role">
            <option value="Хелпер">Хелпер</option>
            <option value="Модератор">Модератор</option>
            <option value="Админ">Админ</option>
        </select>
        
        <label>О себе</label>
        <textarea id="about" rows="3"></textarea>
        
        <button type="submit" id="submit-btn" class="btn">ОТПРАВИТЬ</button>
    </form>
</div>

<script>
    // Твой вебхук
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1475580603184320614/JWKjiXXf0dpGqxXzkSlTbkasrZLhThNASqjfTiguLD7ZILWXHM8CfTTwdyJ48L7tWp6P";

    document.getElementById('anketa').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const btn = document.getElementById('submit-btn');
        btn.disabled = true;
        btn.innerText = "ОТПРАВКА...";

        const data = {
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            age: document.getElementById('age').value,
            role: document.getElementById('role').value,
            about: document.getElementById('about').value || "Не указано"
        };

        // Формируем сообщение для Discord
        const discordMessage = {
            username: "Smarloww Bot",
            embeds: [{
                title: "📩 Новая заявка в команду!",
                color: 5814783,
                fields: [
                    { name: "👤 Ник", value: data.name, inline: true },
                    { name: "📧 Почта", value: data.email, inline: true },
                    { name: "🎂 Возраст", value: data.age, inline: true },
                    { name: "🛠 Роль", value: data.role, inline: true },
                    { name: "📝 О себе", value: data.about }
                ],
                footer: { text: "Система анкет Smarloww" },
                timestamp: new Date()
            }]
        };

        try {
            const response = await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(discordMessage)
            });

            if (response.ok) {
                alert("Успешно! Заявка появилась в Discord.");
                document.getElementById('anketa').reset();
            } else {
                const errText = await response.text();
                alert("Ошибка Discord: " + errText);
            }
        } catch (error) {
            alert("Ошибка сети: " + error.message);
        } finally {
            btn.disabled = false;
            btn.innerText = "ОТПРАВИТЬ";
        }
    });
</script>
</body>
</html>
