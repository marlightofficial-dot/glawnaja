<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Smarloww | Анкета</title>
    <style>
        body { background: #313338; color: #dbdee1; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #2b2d31; padding: 30px; border-radius: 10px; width: 350px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); border: 1px solid #404249; }
        h2 { text-align: center; color: white; margin-bottom: 20px; }
        label { display: block; font-size: 12px; margin: 10px 0 5px; color: #b5bac1; text-transform: uppercase; font-weight: bold; }
        input, textarea, select { width: 100%; padding: 10px; background: #1e1f22; border: 1px solid #1e1f22; color: white; border-radius: 4px; box-sizing: border-box; outline: none; }
        .btn { width: 100%; padding: 12px; background: #5865F2; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 20px; }
        .btn:hover { background: #4752c4; }
    </style>
</head>
<body>

<div class="card">
    <h2>Анкета в команду</h2>
    <form id="anketa">
        <label>Ник Discord</label>
        <input type="text" id="name" required>
        
        <label>Email</label>
        <input type="email" id="email" required>
        
        <label>Возраст</label>
        <input type="number" id="age" required>
        
        <label>Должность</label>
        <select id="role">
            <option value="Хелпер">Хелпер</option>
            <option value="Модератор">Модератор</option>
            <option value="Админ">Админ</option>
        </select>
        
        <label>О себе</label>
        <textarea id="about" rows="3"></textarea>
        
        <button type="submit" class="btn">ОТПРАВИТЬ</button>
    </form>
</div>

<script>
    // Твой Webhook из
    const WEBHOOK = "https://discord.com/api/webhooks/1475580603184320614/JWKjiXXf0dpGqxXzkSlTbkasrZLhThNASqjfTiguLD7ZILWXHM8CfTTwdyJ48L7tWp6P";

    document.getElementById('anketa').onsubmit = async (e) => {
        e.preventDefault();
        
        const n = document.getElementById('name').value;
        const em = document.getElementById('email').value;
        const ag = document.getElementById('age').value;
        const rl = document.getElementById('role').value;
        const ab = document.getElementById('about').value;

        // Создаем ссылки для быстрой отправки письма вручную через твою почту
        const acceptSubject = encodeURIComponent("Ваша заявка принята!");
        const acceptBody = encodeURIComponent(`Привет, ${n}!\nМы рассмотрели твою анкету на роль ${rl} и приняли решение: ТЫ ПРИНЯТ.\nОтпиши в Дискорд для получения прав.`);
        
        const declineSubject = encodeURIComponent("Ответ по вашей заявке");
        const declineBody = encodeURIComponent(`Привет, ${n}.\nК сожалению, твоя анкета на роль ${rl} отклонена. Попробуй в следующий раз!`);

        // Ссылки mailto: откроют твой почтовый клиент (Gmail/Outlook)
        const mailAccept = `mailto:${em}?subject=${acceptSubject}&body=${acceptBody}`;
        const mailDecline = `mailto:${em}?subject=${declineSubject}&body=${declineBody}`;

        await fetch(WEBHOOK, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                username: "Smarloww Bot",
                embeds: [{
                    title: "📩 Новая заявка!",
                    color: 5814783,
                    fields: [
                        { name: "👤 Ник", value: n, inline: true },
                        { name: "📧 Почта", value: em, inline: true },
                        { name: "🎂 Возраст", value: ag, inline: true },
                        { name: "🛠 Роль", value: rl, inline: true },
                        { name: "📝 О себе", value: ab || "Не указано" },
                        { name: "⚡ Написать письмо вручную", value: `[✅ ПРИНЯТЬ (Email)](${mailAccept})\n[❌ ОТКЛОНИТЬ (Email)](${mailDecline})` }
                    ],
                    footer: { text: "Нажми на ссылку выше, чтобы сразу открыть почту" }
                }]
            })
        });

        alert("Заявка отправлена в Discord!");
    };
</script>
</body>
</html>
