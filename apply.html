<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Smarloww Security | Заявка</title>
    <style>
        :root {
            --primary: #5865F2;
            --bg: #1e1f22;
            --card-bg: #2b2d31;
            --input-bg: #1e1f22;
            --text: #ffffff;
            --text-muted: #b5bac1;
            --accent-glow: rgba(88, 101, 242, 0.2);
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at 0% 0%, var(--accent-glow) 0%, transparent 30%);
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 750px;
            border-radius: 15px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.05);
            overflow: hidden;
        }

        .header { padding: 25px 40px; background: rgba(0,0,0,0.3); font-weight: bold; font-size: 20px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .form-content { padding: 40px; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        .field { display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 11px; text-transform: uppercase; color: var(--text-muted); font-weight: 800; }
        
        input, select, textarea {
            background: var(--input-bg);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 14px;
            border-radius: 8px;
            color: white;
            transition: 0.3s;
            outline: none;
        }

        input:focus, textarea:focus, select:focus { border-color: var(--primary); background: #111214; }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 20px;
        }

        .submit-btn:hover { background: #4752c4; transform: scale(1.02); }
    </style>
</head>
<body>

<div class="container">
    <div class="header">🛡️ SMARLOWW SECURITY RECRUITMENT</div>
    <div class="form-content">
        <form id="anketa">
            <div class="grid">
                <div class="field">
                    <label>Твой Ник</label>
                    <input type="text" id="name" placeholder="Swight#0001" required>
                </div>
                <div class="field">
                    <label>Твоя Почта (Email)</label>
                    <input type="email" id="email" placeholder="example@mail.com" required>
                </div>
                <div class="field">
                    <label>Возраст</label>
                    <input type="number" id="age" placeholder="18" required>
                </div>
                <div class="field">
                    <label>Желаемая роль</label>
                    <select id="role">
                        <option value="Хелпер">Хелпер</option>
                        <option value="Модератор">Модератор</option>
                        <option value="Админ">Админ</option>
                        <option value="Менеджер">Менеджер</option>
                        <option value="Куратор">Куратор</option>
                        <option value="Co-Owner">Co-Owner</option>
                    </select>
                </div>
            </div>

            <div class="field">
                <label>Расскажи о себе</label>
                <textarea id="about" rows="4" placeholder="Твой опыт, почему именно ты?"></textarea>
            </div>

            <button type="submit" class="submit-btn" id="s-btn">ОТПРАВИТЬ ДАННЫЕ В ШТАБ</button>
        </form>
    </div>
</div>

<script>
    const WEBHOOK = "https://discord.com/api/webhooks/1475580603184320614/JWKjiXXf0dpGqxXzkSlTbkasrZLhThNASqjfTiguLD7ZILWXHM8CfTTwdyJ48L7tWp6P";

    document.getElementById('anketa').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('s-btn');
        btn.disabled = true;
        btn.innerText = "ОБРАБОТКА...";

        const data = {
            n: document.getElementById('name').value,
            em: document.getElementById('email').value,
            ag: document.getElementById('age').value,
            rl: document.getElementById('role').value,
            ab: document.getElementById('about').value || "Не указано"
        };

        const subAcc = encodeURIComponent("Smarloww Security - Заявка ПРИНЯТА");
        const bodyAcc = encodeURIComponent(`Привет, ${data.n}!\n\nТвоя заявка на роль ${data.rl} была одобрена администрацией Smarloww.\n\nДобро пожаловать в команду!`);
        
        const subDec = encodeURIComponent("Smarloww Security - Заявка ОТКЛОНЕНА");
        const bodyDec = encodeURIComponent(`Привет, ${data.n}.\n\nК сожалению, твоя заявка на роль ${data.rl} была отклонена.\n\nПопробуй в следующий раз.`);

        const linkAcc = `https://mail.google.com/mail/?view=cm&fs=1&to=${data.em}&su=${subAcc}&body=${bodyAcc}`;
        const linkDec = `https://mail.google.com/mail/?view=cm&fs=1&to=${data.em}&su=${subDec}&body=${bodyDec}`;

        try {
            await fetch(WEBHOOK, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    username: "Smarloww Security",
                    embeds: [{
                        title: "🛡️ ПОСТУПИЛА НОВАЯ ЗАЯВКА",
                        color: 5814783,
                        fields: [
                            { name: "👤 Кандидат", value: data.n, inline: true },
                            { name: "🎂 Возраст", value: data.ag, inline: true },
                            { name: "🛠 Пост", value: data.rl, inline: true },
                            { name: "📧 Почта", value: data.em },
                            { name: "📝 О себе", value: data.ab },
                            { name: "⚡ РЕШЕНИЕ АДМИНИСТРАЦИИ", value: `[✅ ПРИНЯТЬ](${linkAcc})  |  [❌ ОТКЛОНИТЬ](${linkDec})` }
                        ],
                        footer: { text: "Отправитель: marlight.official@gmail.com" },
                        timestamp: new Date()
                    }]
                })
            });

            alert("Заявка улетела в Discord!");
            window.location.href = "index.html";
        } catch (err) {
            alert("Что-то пошло не так...");
            btn.disabled = false;
        }
    };
</script>
</body>
</html>
