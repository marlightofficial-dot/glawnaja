<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>SmarlowwTube | Главная</title>
    <style>
        body { background: #0f0f0f; color: white; font-family: "Roboto", sans-serif; margin: 0; padding: 0; }
        .nav { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: #0f0f0f; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 22px; font-weight: bold; color: white; text-decoration: none; display: flex; align-items: center; }
        .logo span { background: #ff0000; color: white; padding: 2px 6px; border-radius: 4px; margin-right: 5px; }
        .auth-btn { border: 1px solid #3ea6ff; color: #3ea6ff; padding: 8px 15px; border-radius: 20px; text-decoration: none; font-size: 14px; }
        
        .container { max-width: 1200px; margin: 20px auto; padding: 0 15px; }
        .apply-card { background: #272727; padding: 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .btn-red { background: #ff0000; color: white; padding: 10px 20px; border-radius: 2px; text-decoration: none; font-weight: bold; text-transform: uppercase; }

        #player-box { display: none; margin-bottom: 30px; }
        .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; border-radius: 12px; overflow: hidden; background: #000; }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .v-card { cursor: pointer; }
        .v-card img { width: 100%; border-radius: 12px; aspect-ratio: 16/9; object-fit: cover; background: #272727; }
        .v-card h4 { margin: 10px 0 5px; font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .v-card p { color: #aaa; font-size: 12px; margin: 0; }
    </style>
</head>
<body>

<div class="nav">
    <a href="#" class="logo"><span>YT</span> Smarloww</a>
    <a href="https://accounts.google.com/ServiceLogin?service=youtube" target="_blank" class="auth-btn">👤 ВОЙТИ</a>
</div>

<div class="container">
    <div class="apply-card">
        <div>
            <h2 style="margin:0">Хочешь стать частью Smarloww?</h2>
            <p style="margin:5px 0 0; color:#aaa">Пока ждешь ответа по заявке — смотри лучшие видео!</p>
        </div>
        <a href="apply.html" class="btn-red">ПОДАТЬ ЗАЯВКУ</a>
    </div>

    <div id="player-box">
        <div class="video-wrapper">
            <iframe id="main-video" src="" allowfullscreen></iframe>
        </div>
        <h3 id="video-title" style="margin-top:15px"></h3>
    </div>

    <h3>Рекомендации</h3>
    <div class="grid" id="video-grid"></div>
</div>

<script>
    const videos = [
        { id: "mrV8kK5t0V8", title: "Bruno Mars - I Just Might (Official Music Video) 2026", channel: "Bruno Mars" },
        { id: "SZpiiixlHWY", title: "Tyla - IS IT (Official Music Video)", channel: "TylaVEVO" },
        { id: "7sxVHYZ_PnA", title: "Harry Styles - Aperture (Official Video)", channel: "Harry Styles" },
        { id: "hwUixddbmrQ", title: "Morgan Wallen - I Got Better (Official Video)", channel: "Morgan Wallen" },
        { id: "vaGf8fmtBr4", title: "Maroon 5, LISA - Priceless", channel: "Maroon 5" },
        { id: "pvf_Qv4rmLM", title: "J. Cole - Two Six (Official Video)", channel: "J. Cole" }
    ];

    const grid = document.getElementById('video-grid');
    const playerBox = document.getElementById('player-box');
    const iframe = document.getElementById('main-video');
    const title = document.getElementById('video-title');

    videos.forEach(v => {
        const div = document.createElement('div');
        div.className = 'v-card';
        div.innerHTML = `
            <img src="https://img.youtube.com/vi/${v.id}/mqdefault.jpg">
            <h4>${v.title}</h4>
            <p>${v.channel}</p>
        `;
        div.onclick = () => {
            window.scrollTo({top: 0, behavior: 'smooth'});
            playerBox.style.display = 'block';
            iframe.src = `https://www.youtube.com/embed/${v.id}?autoplay=1`;
            title.innerText = v.title;
        };
        grid.appendChild(div);
    });
</script>
</body>
</html>
