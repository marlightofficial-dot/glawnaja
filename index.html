<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Smarloww | Главная</title>
    <style>
        :root {
            --primary: #5865F2;
            --bg: #000000;
            --text: #ffffff;
            --text-muted: #b5bac1;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background-color: var(--bg);
        }

        /* Контейнер для видео-фона */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            overflow: hidden;
        }

        .video-background iframe {
            width: 100vw;
            height: 56.25vw; /* 16:9 ratio */
            min-height: 100vh;
            min-width: 177.77vh; /* 16:9 ratio */
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        /* Очень сильное затемнение */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85); /* 85% затемнения */
            z-index: -1;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .content-box {
            padding: 40px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(5px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 600px;
        }

        h1 {
            font-size: 4rem;
            margin: 0;
            background: linear-gradient(135deg, #fff 30%, #5865F2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        p {
            color: var(--text-muted);
            font-size: 1.2rem;
            margin: 20px 0 40px;
            font-weight: 300;
        }

        .btn-apply {
            background: var(--primary);
            color: white;
            padding: 18px 50px;
            border-radius: 15px;
            text-decoration: none;
            font-weight: 800;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(88, 101, 242, 0.4);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .btn-apply:hover {
            transform: scale(1.05);
            background: #4752c4;
            box-shadow: 0 15px 40px rgba(88, 101, 242, 0.6);
        }
    </style>
</head>
<body>

    <div class="video-background">
        <iframe src="https://www.youtube.com/embed/SIdW9vB9n6E?autoplay=1&mute=1&controls=0&loop=1&playlist=SIdW9vB9n6E&showinfo=0&rel=0&modestbranding=1" allow="autoplay"></iframe>
    </div>

    <div class="overlay"></div>

    <div class="container">
        <div class="content-box">
            <h1>Smarloww</h1>
            <p>Стань частью легендарного хоррор-проекта. Мы ищем тех, кто готов менять правила игры.</p>
            <a href="apply.html" class="btn-apply">ПОДАТЬ ЗАЯВКУ</a>
        </div>
    </div>

</body>
</html>
