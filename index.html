<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Smarloww | Hub</title>
    <style>
        :root {
            --primary: #5865F2;
            --bg: #000000;
            --card: #18191c;
            --text: #ffffff;
            --text-muted: #b5bac1;
            --accent: #ed4245;
        }

        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); }

        /* Видео-фон */
        .video-background { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; overflow: hidden; }
        .video-background iframe { width: 100vw; height: 56.25vw; min-height: 100vh; min-width: 177.77vh; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); z-index: -1; }

        /* Навигация */
        .navbar { position: fixed; top: 0; width: 100%; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; z-index: 100; background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); }
        .profile-trigger { display: flex; align-items: center; gap: 12px; cursor: pointer; padding: 5px 15px; border-radius: 20px; transition: 0.3s; border: 1px solid rgba(255,255,255,0.1); }
        .profile-trigger:hover { background: rgba(255,255,255,0.1); }
        .nav-avatar { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; background: var(--primary); }
        .verified-badge { color: #00b0f4; font-size: 14px; margin-left: 4px; }

        /* Чат (в стиле ТГ) */
        .chat-container { position: fixed; bottom: 20px; right: 20px; width: 350px; height: 450px; background: var(--card); border-radius: 15px; display: flex; flex-direction: column; border: 1px solid #2b2d31; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 90; }
        .chat-header { padding: 15px; background: #232428; border-radius: 15px 15px 0 0; font-weight: bold; border-bottom: 1px solid #2b2d31; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { background: #2e3035; padding: 8px 12px; border-radius: 10px; max-width: 80%; width: fit-content; font-size: 14px; }
        .msg-name { font-size: 11px; color: var(--primary); font-weight: bold; margin-bottom: 4px; display: flex; align-items: center; }
        .chat-input { padding: 15px; display: flex; gap: 10px; }
        .chat-input input { flex: 1; background: #1e1f22; border: none; padding: 10px; border-radius: 8px; color: white; outline: none; }
        .chat-input button { background: var(--primary); border: none; color: white; padding: 0 15px; border-radius: 8px; cursor: pointer; }

        /* Главный контент */
        .main { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; }
        h1 { font-size: 4rem; margin: 0; background: linear-gradient(135deg, #fff 40%, #5865F2 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn-apply { background: var(--primary); color: white; padding: 18px 50px; border-radius: 15px; text-decoration: none; font-weight: bold; margin-top: 25px; transition: 0.3s; }
        .btn-apply:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(88,101,242,0.4); }

        /* Модалка настроек */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: var(--card); padding: 30px; border-radius: 20px; width: 350px; text-align: center; }
        .modal-content input { width: 100%; padding: 10px; margin: 10px 0; background: #1e1f22; border: 1px solid #2b2d31; color: white; border-radius: 8px; box-sizing: border-box; }
        .save-btn { width: 100%; padding: 12px; background: var(--primary); border: none; color: white; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="video-background">
        <iframe src="https://www.youtube.com/embed/SIdW9vB9n6E?autoplay=1&mute=1&controls=0&loop=1&playlist=SIdW9vB9n6E" allow="autoplay"></iframe>
    </div>
    <div class="overlay"></div>

    <nav class="navbar">
        <div style="font-weight: 800; font-size: 20px;">SMARLOWW</div>
        <div class="profile-trigger" onclick="openSettings()">
            <img src="" id="nav-avatar" class="nav-avatar" onerror="this.src='https://ui-avatars.com/api/?name=User&background=5865F2&color=fff'">
            <span id="nav-username">Гость</span>
            <span id="nav-badge"></span>
        </div>
    </nav>

    <div class="main">
        <h1>SMARLOWW</h1>
        <p style="color: var(--text-muted); max-width: 500px;">Стань частью легендарного сервера. Мы ищем тех, кто готов менять правила игры и Дискорда. Будем ждать...</p>
        <a href="apply.html" class="btn-apply">ПОДАТЬ ЗАЯВКУ</a>
    </div>

    <div class="chat-container">
        <div class="chat-header">🌐 Общий чат</div>
        <div class="chat-messages" id="chat-box">
            <div class="msg"><div class="msg-name">Система</div>Добро пожаловать в чат Smarloww!</div>
        </div>
        <div class="chat-input">
            <input type="text" id="chat-input" placeholder="Напишите сообщение...">
            <button onclick="sendMessage()">➤</button>
        </div>
    </div>

    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h3 style="margin-top:0">Настройки профиля</h3>
            <input type="text" id="set-name" placeholder="Твой ник">
            <input type="text" id="set-avatar" placeholder="Ссылка на аватарку (URL)">
            <input type="text" id="set-discord" placeholder="Discord (например: mercy.mie)">
            <button class="save-btn" onclick="saveProfile()">СОХРАНИТЬ</button>
            <button class="save-btn" style="background:#4f545c" onclick="closeSettings()">ОТМЕНА</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');

        window.onload = () => {
            loadProfile();
            loadMessages();
        };

        function openSettings() { document.getElementById('settingsModal').style.display = 'flex'; }
        function closeSettings() { document.getElementById('settingsModal').style.display = 'none'; }

        function saveProfile() {
            const name = document.getElementById('set-name').value;
            const av = document.getElementById('set-avatar').value;
            const ds = document.getElementById('set-discord').value;

            localStorage.setItem('sm_name', name);
            localStorage.setItem('sm_avatar', av);
            localStorage.setItem('sm_discord', ds);

            loadProfile();
            closeSettings();
        }

        function loadProfile() {
            const name = localStorage.getItem('sm_name') || 'Гость';
            const av = localStorage.getItem('sm_avatar') || '';
            const ds = localStorage.getItem('sm_discord') || '';

            document.getElementById('nav-username').innerText = name;
            if(av) document.getElementById('nav-avatar').src = av;
            
            // Галочка для тебя!
            const badge = document.getElementById('nav-badge');
            if (ds.toLowerCase() === 'mercy.mie') {
                badge.innerHTML = ' <span title="Верифицированный владелец" style="color:#00b0f4">✔</span>';
                localStorage.setItem('is_verified', 'true');
            } else {
                badge.innerHTML = '';
            }

            document.getElementById('set-name').value = name;
            document.getElementById('set-avatar').value = av;
            document.getElementById('set-discord').value = ds;
        }

        function sendMessage() {
            const input = document.getElementById('chat-input');
            if(!input.value) return;

            const name = localStorage.getItem('sm_name') || 'Гость';
            const ds = localStorage.getItem('sm_discord') || '';
            const isV = (ds.toLowerCase() === 'mercy.mie') ? '<span style="color:#00b0f4">✔</span>' : '';

            const msgData = {
                name: name,
                text: input.value,
                badge: isV
            };

            // Сохраняем в локальную память чата
            let msgs = JSON.parse(localStorage.getItem('sm_chat') || '[]');
            msgs.push(msgData);
            localStorage.setItem('sm_chat', JSON.stringify(msgs));

            input.value = '';
            renderMessages();
        }

        function renderMessages() {
            const msgs = JSON.parse(localStorage.getItem('sm_chat') || '[]');
            chatBox.innerHTML = '<div class="msg"><div class="msg-name">Система</div>Добро пожаловать в чат Smarloww!</div>';
            msgs.forEach(m => {
                const div = document.createElement('div');
                div.className = 'msg';
                div.innerHTML = `<div class="msg-name">${m.name} ${m.badge}</div>${m.text}`;
                chatBox.appendChild(div);
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function loadMessages() { renderMessages(); }
    </script>
</body>
</html>
